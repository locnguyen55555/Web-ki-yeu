<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kỷ niệm học sinh – kiniemhocsinh.io.vn</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Caveat:wght@600;700&family=Charm:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
/* ===== BIẾN GỐC CỦA WEB CHÍNH ===== */
:root{
  --ink:#1d2a4a;--sun:#ffd23f;--sky:#dfe9f7;--coral:#ff5d73;--paper:#fbfbf8;
  /* Map Lucian UX tokens sang màu web chính */
  --ux-page:var(--sky);
  --ux-surface:#ffffff;
  --ux-surface-2:#f5f3ef;
  --ux-surface-3:#eae7e1;
  --ux-ink:var(--ink);
  --ux-ink-2:#57535f;
  --ux-ink-3:#8e8a97;
  --ux-line:rgba(29,42,74,.09);
  --ux-line-2:rgba(29,42,74,.17);
  --ux-accent:var(--coral);
  --ux-accent-2:#2f8fe0;
  --ux-accent-soft:rgba(255,93,115,.12);
  --ux-accent-ink:#ffffff;
  --ux-mint:#119c72;
  --ux-warn:#d6731e;
  --ux-danger:#d93a55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(29,42,74,.14);
  --ux-shadow-strong:rgba(29,42,74,.3);
  --ux-grad:linear-gradient(120deg,var(--coral),var(--sun) 55%,#1fb89a);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--sky);color:var(--ink);padding-bottom:90px}
.hand{font-family:'Caveat',cursive}
.ul{background:linear-gradient(transparent 62%,var(--sun) 62%,var(--sun) 92%,transparent 92%);background-size:0 100%;background-repeat:no-repeat;animation:ul .9s .2s forwards}
@keyframes ul{to{background-size:100% 100%}}
.btn{background:var(--ink);color:#fff;border-radius:999px;padding:.6rem 1.2rem;font-weight:700;touch-action:manipulation}
.btn.sun{background:var(--sun);color:var(--ink)} .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.inp{width:100%;border:2px solid var(--ink);border-radius:12px;padding:.6rem .8rem;background:#fff}
.card{background:var(--paper);border-radius:14px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.pol{background:#fff;padding:8px 8px 44px;box-shadow:0 4px 14px #1d2a4a33;position:relative;transition:transform .2s}
.pol:nth-child(odd){transform:rotate(-1.5deg)}.pol:nth-child(even){transform:rotate(1.2deg)}
.pol .ky22-wrap{position:absolute;left:10px;bottom:7px}
.ky-heart{display:inline-flex;align-items:center;gap:6px;font-size:17px;line-height:1;font-weight:700;color:var(--ink);background:none;border:0;padding:2px 4px;cursor:pointer;touch-action:manipulation;transition:color .2s,transform .15s}
.ky-heart svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:fill .2s,stroke .2s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.ky-heart.is-liked{color:#ff3b5c}
.ky-heart.is-liked svg{fill:#ff3b5c;stroke:#ff3b5c}

/* ===== #258 – Skeleton / Blur-up nâng cấp ===== */
.blur-up{position:relative;overflow:hidden}
.blur-up img{filter:blur(14px);transition:filter .6s;width:100%;height:100%;object-fit:cover;display:block}
.blur-up img.ok{filter:none}
.blur-up::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);
  background-size:250% 100%;
  animation:kysh 1.4s linear infinite;
  z-index:1;pointer-events:none;
  transition:opacity .4s;
}
.blur-up img.ok ~ .blur-up::before,.blur-up.loaded::before{opacity:0}
@keyframes kysh{from{background-position:130% 0}to{background-position:-30% 0}}
.blur-up img.ok{filter:none}
/* Khi ảnh ok thì tắt shimmer */
.blur-up:has(img.ok)::before{opacity:0;animation:none}

.pill{position:relative;display:flex;background:#fff;border-radius:999px;border:2px solid var(--ink);padding:3px}
.pill button{flex:1;padding:.5rem;border-radius:999px;font-weight:700;position:relative;z-index:1;transition:color .3s}
.pill i{position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);background:var(--ink);border-radius:999px;transition:transform .5s cubic-bezier(.34,1.45,.64,1)}

/* ===== #369 – Fan ảnh xòe quạt ===== */
.fan{position:relative;height:230px;margin:0 auto;width:280px;cursor:pointer}
.fan .kyfan-p{position:absolute;left:50%;top:10px;width:150px;height:185px;object-fit:cover;border:8px solid #fff;border-bottom-width:30px;box-shadow:0 8px 20px #0003;transform-origin:50% 120%;transition:transform .7s cubic-bezier(.3,1.2,.4,1);margin-left:-75px;border-radius:4px}
.fan.fanned .kyfan-p{transition-delay:calc(var(--fi,0)*40ms)}

/* ===== #048 – Swipe tabs ===== */
.kytab-wrap{position:relative;overflow:hidden}
.kytab-bar{position:relative;display:flex;padding:3px;border-radius:999px;background:#fff;border:2px solid var(--ink)}
.kytab-pill{position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);background:var(--ink);border-radius:999px;transition:transform .5s cubic-bezier(.34,1.45,.64,1)}
.kytab-btn{flex:1;padding:.5rem;border-radius:999px;font-weight:700;position:relative;z-index:1;transition:color .3s;border:0;background:none;cursor:pointer}
.kytab-line{position:absolute;left:0;bottom:-2px;height:3px;border-radius:3px 3px 0 0;background:var(--ux-grad);pointer-events:none;transition:width .3s,transform .3s}
.kytab-pages{display:flex;overflow-x:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth}
.kytab-page{flex:none;width:100%;scroll-snap-align:start}

/* ===== Sheet ===== */
.sheet{position:fixed;inset:0;background:#0007;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:1.2rem;animation:up .3s}
@keyframes up{from{transform:translateY(100%)}}
@media(min-width:640px){.sheet{align-items:center}.sheet>div{border-radius:22px}}

/* ===== #474 – Music player glass ===== */
#mp{
  position:fixed;right:3px;bottom:4px;z-index:50;
  background:rgba(255,255,255,.55);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
  border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 10px 28px rgba(29,42,74,.25);
  border-radius:18px;padding:8px 10px 8px 8px;
  display:flex;align-items:center;gap:8px;
  min-width:0;
}
.kymp-art{flex:none;width:38px;height:38px;border-radius:10px;overflow:hidden;position:relative}
.kymp-art img,.kymp-art-inner{width:100%;height:100%;object-fit:cover}
.kymp-art-inner{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,var(--sun) 0 18%,#111 19% 100%);border-radius:50%}
.kymp-spin{animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.kymp-info{flex:1;min-width:0;max-width:90px}
.kymp-title{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
/* Play/pause clip-path animation */
.kymp-ic{position:relative;width:14px;height:16px;display:inline-block}
.kymp-ic i{position:absolute;inset:0;background:var(--ink);transition:clip-path .3s cubic-bezier(.5,0,.2,1.2)}
.kymp-ic i:first-child{clip-path:polygon(0% 0%,50% 25%,50% 75%,0% 100%)}
.kymp-ic i:last-child{clip-path:polygon(50% 25%,100% 50%,100% 50%,50% 75%)}
.kymp-playing .kymp-ic i:first-child{clip-path:polygon(2% 0%,38% 0%,38% 100%,2% 100%)}
.kymp-playing .kymp-ic i:last-child{clip-path:polygon(62% 0%,98% 0%,98% 100%,62% 100%)}
/* Seek bar */
.kymp-seek{flex:1;height:18px;cursor:pointer;min-width:50px;max-width:70px;display:flex;align-items:center}
.kymp-track{position:relative;width:100%;height:4px;border-radius:3px;background:rgba(29,42,74,.18);overflow:hidden}
.kymp-fill{position:absolute;left:0;top:0;bottom:0;background:var(--coral);border-radius:3px;width:0;transition:width .3s linear}

/* ===== #429 – Search combobox ===== */
.kysrc{position:relative}
.kysrc-f{position:relative;z-index:2;display:flex;align-items:center;gap:8px;height:44px;padding:0 8px 0 12px;border-radius:14px;background:#fff;border:2px solid var(--ink);cursor:text;transition:box-shadow .2s}
.kysrc-f:focus-within{box-shadow:0 0 0 3px rgba(29,42,74,.12)}
.kysrc-f>svg{flex:none;width:16px;height:16px;fill:none;stroke:var(--ux-ink-3);stroke-width:2;stroke-linecap:round}
.kysrc-in{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14px;font-weight:500;color:var(--ink)}
.kysrc-in:focus,.kysrc-in:focus-visible{outline:none;box-shadow:none}
.kysrc-in::placeholder{color:var(--ux-ink-3)}
.kysrc-dd{position:absolute;left:0;right:0;top:calc(100% + 6px);padding:4px;border-radius:14px;background:#fff;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);overflow:hidden;transform-origin:50% 0;opacity:0;transform:translateY(-8px) scale(.96);visibility:hidden;transition:opacity .16s,transform .2s,visibility 0s linear .2s;z-index:30}
.kysrc.is-open .kysrc-dd{opacity:1;transform:none;visibility:visible;transition:opacity .18s,transform .3s cubic-bezier(.3,1.4,.5,1),visibility 0s}
.kysrc-pill{position:absolute;left:4px;right:4px;top:4px;height:38px;border-radius:9px;background:rgba(29,42,74,.07);transform:translateY(var(--py,0px));opacity:var(--po,0);transition:transform .4s cubic-bezier(.3,1.5,.5,1),opacity .15s;pointer-events:none}
.kysrc-o{position:relative;display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:9px;cursor:pointer;color:var(--ux-ink-2);text-decoration:none}
.kysrc-o[aria-selected="true"]{color:var(--ink)}
.kysrc-t{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kysrc-t mark{background:rgba(255,210,63,.55);color:var(--ink);font-weight:700;border-radius:3px;padding:0 1px}
.kysrc-m{flex:none;font-size:11px;color:var(--ux-ink-3)}
.kysrc-no{padding:10px;font-size:13px;color:var(--ux-ink-3)}

/* ===== OTP / mã lớp ===== */
.kyotp-wrap{position:relative;display:flex;gap:6px;justify-content:center;margin:12px 0}
.kyotp-c{
  position:relative;width:46px;height:56px;border-radius:12px;
  background:#fff;box-shadow:inset 0 0 0 1.5px rgba(29,42,74,.18);
  display:grid;place-items:center;overflow:hidden;
  font-size:24px;font-weight:760;font-variant-numeric:tabular-nums;
  transition:box-shadow .25s,background-color .4s,color .4s,transform .45s cubic-bezier(.34,1.45,.64,1)
}
.kyotp-c span{display:block;animation:kyotp-in .4s cubic-bezier(.34,1.45,.64,1)}
@keyframes kyotp-in{from{transform:translateY(70%);opacity:0}}
.kyotp-c.cur{box-shadow:inset 0 0 0 2px var(--coral),0 0 0 3px rgba(255,93,115,.15)}
.kyotp-c.cur::after{content:"";position:absolute;left:50%;top:14px;bottom:14px;width:2px;margin-left:-1px;border-radius:1px;background:var(--coral);animation:kyotp-blink 1s steps(1) infinite}
.kyotp-c.cur.has::after{display:none}
@keyframes kyotp-blink{50%{opacity:0}}
.kyotp-wrap.is-ok .kyotp-c{background:rgba(17,156,114,.12);box-shadow:inset 0 0 0 2px var(--ux-mint);color:var(--ux-mint);animation:kyotp-wave .5s cubic-bezier(.2,.8,.2,1);animation-delay:calc(var(--i)*60ms)}
@keyframes kyotp-wave{40%{transform:translateY(-6px)}}
.kyotp-wrap.is-bad{animation:kyotp-shake .45s cubic-bezier(.36,.07,.19,.97)}
.kyotp-wrap.is-bad .kyotp-c{box-shadow:inset 0 0 0 2px var(--coral);color:var(--coral)}
@keyframes kyotp-shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(7px)}}
.kyotp-real{position:absolute;inset:0;width:100%;opacity:0;border:0;font-size:16px;cursor:text;caret-color:transparent;color:transparent;background:transparent}

/* ===== #480 – PIN pad chấm ===== */
.kypin-wrap{padding:12px 0}
.kypin-dots{display:flex;justify-content:center;gap:14px;height:36px;align-items:center;margin:4px 0;position:relative}
.kypin-d{width:12px;height:12px;border-radius:50%;background:rgba(29,42,74,.18);box-shadow:inset 0 0 0 1px rgba(29,42,74,.2);transition:background-color .2s,transform .5s cubic-bezier(.5,0,.2,1)}
.kypin-d.on{background:var(--ink);box-shadow:none;animation:kypin-pop .42s cubic-bezier(.34,1.9,.5,1)}
@keyframes kypin-pop{0%{transform:scale(.4)}55%{transform:scale(1.45)}100%{transform:scale(1)}}
.kypin-d.off{animation:kypin-out .25s cubic-bezier(.2,.8,.2,1)}
@keyframes kypin-out{from{transform:scale(1.3);background:var(--ink)}}
.kypin-dots.is-bad .kypin-d{background:var(--coral);box-shadow:none}
.kypin-dots.is-shake{animation:kypin-shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes kypin-shake{12%,52%{transform:translateX(-9px)}32%,72%{transform:translateX(9px)}88%{transform:translateX(-3px)}}
.kypin-ok{position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;background:var(--ux-mint);display:grid;place-items:center;transform:scale(0);pointer-events:none}
.kypin-dots.is-ok .kypin-d{opacity:0;transform:translateX(var(--kptx,0)) scale(.6);transition:transform .38s cubic-bezier(.6,0,.4,1),opacity .2s .26s}
.kypin-dots.is-ok .kypin-ok{animation:kypin-okpop .55s cubic-bezier(.34,1.8,.5,1) .3s forwards}
@keyframes kypin-okpop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.kypin-ok svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.kypin-ok path{stroke-dasharray:22;stroke-dashoffset:22}
.kypin-dots.is-ok .kypin-ok path{animation:kypin-draw .35s cubic-bezier(.2,.8,.2,1) .55s forwards}
@keyframes kypin-draw{to{stroke-dashoffset:0}}
.kypin-pad{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:44px;gap:4px;margin-top:8px}
.kypin-k{position:relative;display:grid;place-items:center;padding:0;border:0;border-radius:14px;background:none;color:var(--ink);font-size:22px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;touch-action:manipulation;transition:transform .15s}
.kypin-k::before{content:"";position:absolute;left:50%;top:50%;width:48px;height:40px;margin:-20px 0 0 -24px;border-radius:12px;background:rgba(29,42,74,.07);opacity:0;transform:scale(.5);transition:opacity .25s,transform .4s cubic-bezier(.34,1.6,.5,1)}
.kypin-k:hover::before{opacity:.7;transform:scale(.9)}
.kypin-k:active::before,.kypin-k.dn::before{opacity:1;transform:scale(1.05);transition-duration:.08s,.12s}
.kypin-k span{position:relative}
.kypin-fn{font-size:12px;font-weight:700;color:var(--ux-ink-2)}
.kypin-fn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kypin-err{font-size:12px;color:var(--coral);text-align:center;min-height:18px;margin:4px 0 0}

/* ===== #022 – Like burst nâng cấp ===== */
.ky22-wrap{position:relative;display:inline-block}
.ky22-ring{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;border:10px solid #FF7A93;transform:scale(0);opacity:0;pointer-events:none}
.ky22-wrap.is-pop .ky22-ring{animation:ky22-ring .6s cubic-bezier(.2,.8,.2,1) .05s}
@keyframes ky22-ring{0%{transform:scale(.3);opacity:1;border-width:14px}100%{transform:scale(1.6);opacity:0;border-width:0}}
.ky22-dot{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;transform:rotate(var(--a))}
.ky22-dot i{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--c);opacity:0}
.ky22-wrap.is-pop .ky22-dot i{animation:ky22-fly .65s cubic-bezier(.2,.8,.2,1) .15s}
@keyframes ky22-fly{0%{opacity:1;transform:translate(0,-36px) scale(1)}100%{opacity:0;transform:translate(0,-72px) scale(.2)}}
.ky22-cnt{display:inline-block;overflow:hidden;height:18px;vertical-align:middle;font-variant-numeric:tabular-nums}
.ky22-cnt span{display:block;line-height:18px;transition:transform .45s cubic-bezier(.34,1.45,.64,1),opacity .3s}

/* ===== #061 – Lightbox toàn màn hình ===== */
#kylb-overlay{position:fixed;inset:0;z-index:70;background:#000a;display:flex;align-items:center;justify-content:center;animation:kylb-in .25s;touch-action:none;user-select:none;-webkit-user-select:none}
@keyframes kylb-in{from{opacity:0}}
#kylb-overlay img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;will-change:transform;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#kylb-overlay.zoomed img{cursor:grab}
#kylb-overlay.zoomed.is-drag img{cursor:grabbing}
#kylb-overlay button{position:absolute;z-index:2;background:rgba(0,0,0,.45);border:0;color:#fff;font-size:1.8rem;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;cursor:pointer}
#kylb-prev{left:12px}#kylb-next{right:12px}#kylb-close{top:14px;right:14px;font-size:1.3rem}
#kylb-overlay .kylb-zoom-label{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:2;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;opacity:0;pointer-events:none;cursor:pointer;transition:opacity .25s}
#kylb-overlay.zoomed .kylb-zoom-label{opacity:1;pointer-events:auto}

/* ===== #032/#075 – Drop zone nâng cấp ===== */
.kydrop{position:relative;border-radius:20px;background:#fff;border:2px dashed rgba(29,42,74,.3);text-align:center;padding:20px 16px;cursor:pointer;transition:transform .4s cubic-bezier(.34,1.45,.64,1),background .3s,border-color .3s}
.kydrop svg.kydrop-dash{position:absolute;left:1px;top:1px;width:calc(100% - 2px);height:calc(100% - 2px);overflow:visible;pointer-events:none;border-radius:19px}
.kydrop-dash rect{fill:none;stroke:rgba(29,42,74,.25);stroke-width:2;stroke-dasharray:8 7;transition:stroke .3s}
.kydrop:hover .kydrop-dash rect,.kydrop.is-over .kydrop-dash rect{stroke:var(--coral);animation:kydrop-march .9s linear infinite}
@keyframes kydrop-march{to{stroke-dashoffset:-30}}
.kydrop.is-over{transform:scale(1.02);background:rgba(255,93,115,.04);border-color:transparent}
.kydrop-orb{width:48px;height:48px;border-radius:16px;background:linear-gradient(140deg,var(--coral),var(--sun));box-shadow:0 12px 22px -10px rgba(255,93,115,.6);display:grid;place-items:center;margin:0 auto 10px;transition:transform .5s cubic-bezier(.34,1.45,.64,1)}
.kydrop-orb svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kydrop:hover .kydrop-orb{transform:translateY(-4px)}
.kydrop.is-over .kydrop-orb{transform:translateY(-8px) scale(1.1) rotate(-5deg)}
.kyup-list{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.kyup-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#fff;border:2px solid var(--ink);position:relative;overflow:hidden;animation:kyup-in .4s cubic-bezier(.34,1.45,.64,1)}
@keyframes kyup-in{from{transform:translateY(-8px) scale(.96);opacity:0}}
.kyup-name{flex:1;min-width:0;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kyup-pct{font-size:11px;color:var(--ux-ink-3);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.kyup-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--coral);transform-origin:0 50%;transition:transform .2s linear}
.kyup-row.done .kyup-bar{background:var(--ux-mint)}
.kyup-row.fail{border-color:var(--coral);background:#fff5f6}
.kyup-row.fail .kyup-pct{color:var(--coral);font-weight:700}
.kyup-err{display:block;font-size:11px;color:var(--coral);font-weight:600;margin-top:2px;text-align:left}
.kydrop.is-uploading,#drop.is-uploading{pointer-events:none;opacity:.75}
#drop.btn.is-over{outline:2px dashed var(--coral);outline-offset:2px;transform:scale(1.03)}

/* ===== #472 – Admin storage bar ===== */
.kyst-bar{position:relative;display:flex;gap:2px;height:24px;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.kyst-seg{flex:none;height:100%;transition:width .9s cubic-bezier(.22,.9,.24,1),opacity .3s;width:0}

    if(!blob||!blob.size)throw new Error("Không thể nén/cắt ảnh đại diện.");
    return new File([blob],(file.name||"avatar").replace(/\.[^.]+$/,"")+".jpg",{type:"image/jpeg"});
  }finally{cleanup()}
}

function calcDeleteVote(c){
  const ms=by("members","classId",c?.id);
  const validIds=new Set(ms.map(m=>m.id));
  const votes=c?.deleteReq?.votes||{};
  let yes=0,no=0;
  for(const [mid,choice] of Object.entries(votes)){
    if(!validIds.has(mid))continue;
    if(choice==="yes")yes++;
    else if(choice==="no")no++;
  }
  const total=ms.length;
  const yesPct=total?Math.round((yes/total)*100):0;
  const passed=total>0&&(yes/total)>=0.6;
  const failed=total>0&&((total-no)/total)<0.6;
  return{total,yes,no,yesPct,passed,failed};
}

// Bind pin pad
function bindPinPad(id,maxLen=6,onChange){
  const wrap=document.getElementById("kypin-"+id);if(!wrap)return;
  const inp=document.getElementById(id);
  const dotsEl=wrap.querySelector(".kypin-dots");
  const dots=[...wrap.querySelectorAll(".kypin-d")];
  const pad=wrap.querySelector(".kypin-pad");
  let val="",busy=false;
  function paintDots(){
    dots.forEach((d,i)=>{
      const on=i<val.length;
      if(on&&!d.classList.contains("on")){d.classList.remove("off");d.classList.add("on")}
      if(!on&&d.classList.contains("on")){d.classList.remove("on");d.classList.add("off")}
    });
    inp.value=val;if(onChange)onChange(val);
  }
  function pressAnim(btn){btn.classList.add("dn");setTimeout(()=>btn.classList.remove("dn"),130)}
  function addDigit(d){
    if(busy||val.length>=maxLen)return;
    val+=d;paintDots();
    if(val.length===maxLen){inp.dispatchEvent(new Event("change"))}
  }
  function del(){if(busy||!val)return;val=val.slice(0,-1);paintDots()}
  pad.addEventListener("pointerdown",e=>{const k=e.target.closest(".kypin-k");if(k)pressAnim(k)});
  pad.addEventListener("click",e=>{
    const k=e.target.closest(".kypin-k");if(!k)return;
    if(k.dataset.pk==="del")del();else addDigit(k.dataset.pk);
  });
  // Expose methods
  inp._pinBad=()=>{
    dotsEl.classList.add("is-bad","is-shake");
    setTimeout(()=>{dotsEl.classList.remove("is-shake","is-bad");val="";paintDots();busy=false},600);
  };
  inp._pinOk=()=>{
    // compute centers
    const mid=dotsEl.getBoundingClientRect(),cx=mid.left+mid.width/2;
    dots.forEach(d=>{const r=d.getBoundingClientRect();d.style.setProperty("--kptx",(cx-(r.left+r.width/2))+"px")});
    dotsEl.classList.add("is-ok");busy=true;
    setTimeout(()=>{dotsEl.classList.remove("is-ok");dots.forEach(d=>d.classList.remove("on","off"));val="";paintDots();busy=false},2200);
  };
  inp._reset=()=>{val="";dotsEl.classList.remove("is-ok","is-bad","is-shake");dots.forEach(d=>d.classList.remove("on","off"));busy=false;paintDots()};
  paintDots();
}

/* #429 – Search bind nâng cấp */
function searchBind(w){
  const srcWrap=w?.classList?.contains("kysrc")?w:document.getElementById("kysrc-home");
  if(!srcWrap||srcWrap.dataset.bound)return;
  srcWrap.dataset.bound="1";
  const inpEl=srcWrap.querySelector(".kysrc-in");
  const dd=srcWrap.querySelector(".kysrc-dd");
  const lb=srcWrap.querySelector(".kysrc-lb");
  const pill=srcWrap.querySelector(".kysrc-pill");
  if(!inpEl||!dd||!lb||!pill)return;
  let list=[],act=-1;
  const foldChar=c=>{const f=c.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");return /[a-z0-9]/.test(f)?f[0]:" "};
  const norm=s=>[...String(s??"").normalize("NFC")].map(foldChar).join("").replace(/\s+/g," ").trim();
  const match=(text,nq,raw)=>{const nt=norm(text);return nq?nt.includes(nq)||nt.replace(/\s+/g,"").includes(nq.replace(/\s+/g,"")):String(text??"").toLowerCase().includes(raw)};
  function hl(s,rawQ){
    const chars=[...String(s??"").normalize("NFC")];
    const folded=chars.map(foldChar).join("");
    const qf=[...String(rawQ??"").normalize("NFC")].map(foldChar).join("").trim();
    const idx=qf?folded.indexOf(qf):-1;
    if(idx<0)return esc(s);
    return esc(chars.slice(0,idx).join(""))+`<mark>${esc(chars.slice(idx,idx+qf.length).join(""))}</mark>`+esc(chars.slice(idx+qf.length).join(""));
  }
  function setOpen(open){srcWrap.classList.toggle("is-open",open);inpEl.setAttribute("aria-expanded",open?"true":"false")}
  function paint(jump){
    [...lb.querySelectorAll(".kysrc-o")].forEach((o,i)=>o.setAttribute("aria-selected",i===act?"true":"false"));
    if(jump){pill.style.transition="none";void pill.offsetWidth}
    pill.style.setProperty("--py",(Math.max(0,act)*38)+"px");
    pill.style.setProperty("--po",act>=0?1:0);
    if(jump){void pill.offsetWidth;pill.style.transition=""}
  }
  function render(){
    const raw=inpEl.value.trim(),low=raw.toLowerCase(),nq=norm(raw);
    if(!raw){list=[];act=-1;setOpen(false);return}
    list=[
      ...S.schools.filter(s=>match(s.name,nq,low)).map(s=>({label:s.name,sub:"Trường",href:"#/s/"+s.id})),
      ...S.classes.filter(c=>match(c.name,nq,low)||match(get("schools",c.schoolId)?.name||"",nq,low)).map(c=>({label:c.name+" – "+(get("schools",c.schoolId)?.name||""),sub:"Lớp",href:"#/c/"+c.id}))
    ].slice(0,6);
    lb.innerHTML=list.length?list.map((x,i)=>`<a href="${x.href}" class="kysrc-o" role="option" aria-selected="false" style="--i:${i}"><span class="kysrc-t">${hl(x.label,raw)}</span><span class="kysrc-m">${esc(x.sub)}</span></a>`).join(""):`<div class="kysrc-no">Không thấy kết quả</div>`;
    setOpen(true);act=list.length?0:-1;paint(true);
  }
  inpEl.addEventListener("input",render);
  inpEl.addEventListener("focus",()=>{if(inpEl.value.trim())render()});
  inpEl.addEventListener("click",()=>{if(!srcWrap.classList.contains("is-open")&&inpEl.value.trim())render()});
  inpEl.addEventListener("keydown",e=>{
    const open=srcWrap.classList.contains("is-open");
    if((e.key==="ArrowDown"||e.key==="ArrowUp")&&list.length){
      e.preventDefault();
      if(!open){render();return}
      act=(act+(e.key==="ArrowDown"?1:-1)+list.length)%list.length;
      paint(false);
    }else if(e.key==="Enter"&&open&&act>=0&&list[act]){
      e.preventDefault();setOpen(false);location.hash=list[act].href;
    }else if(e.key==="Escape"&&open){
      e.preventDefault();setOpen(false);
    }
  });
  lb.addEventListener("pointermove",e=>{
    const o=e.target.closest(".kysrc-o");if(!o)return;
    const i=[...lb.children].indexOf(o);
    if(i>=0&&i!==act){act=i;paint(false)}
  });
  lb.addEventListener("click",()=>setOpen(false));
  dd.addEventListener("mousedown",e=>{if(!e.target.closest("a"))e.preventDefault()});
  document.addEventListener("click",e=>{if(!srcWrap.isConnected)return;if(!srcWrap.contains(e.target))setOpen(false)});
}

  const imgs=[...fan.querySelectorAll(".kyfan-p")];
  if(!imgs.length)return;
  let spread=false;
  function place(){
    const n=imgs.length;
    imgs.forEach((img,i)=>{
      if(spread){
        const col=i%3,row=Math.floor(i/3);
        img.style.transform=`translate(${(col-1)*110}px,${(row-0.5)*130}px) rotate(0deg)`;
        img.style.zIndex=1;
        img.style.setProperty("--dl",(i*40)+"ms");
      } else {
        const k=i-n+1;
        img.style.transform=`translate(${k*2}px,${k*-2}px) rotate(${(k*8+2)}deg)`;
        img.style.zIndex=i+1;
        img.style.setProperty("--dl",((n-1-i)*30)+"ms");
      }
    });
  }
  fan.addEventListener("click",()=>{spread=!spread;place()});
  fan.addEventListener("mouseenter",()=>{if(!spread)imgs.forEach((img,i)=>{const k=i-imgs.length+1;img.style.transform=`translate(${k*18}px,${k*-4}px) rotate(${k*8+2}deg)`})});
  fan.addEventListener("mouseleave",()=>{if(!spread)place()});
  place();
}

function countUp(){

  $$("[data-n]").forEach(e=>{
    const n=+e.dataset.n||0;
    if(n<=0||rm){e.textContent=n;return}
    let c=0;e.textContent=0;

  });
}

/* #048 – Bind class với swipe + underline động */
function bindClass(id){const P=$("#pane");if(!P)return;
  const pill=document.getElementById("kytab-pill-"+id);
  const btns=$$(`#kytabs-${id} .kytab-btn`);
  const draw=()=>{
    // Move pill
    if(pill&&btns[tab]){
      pill.style.transform=`translateX(${tab*100}%)`;
    }
    btns.forEach(b=>{b.style.color=+b.dataset.t===tab?"#fff":"#667"});
    P.innerHTML=tab?memberTab(id):groupTab(id);after(id);
    P.animate([{transform:"translateX("+(tab?40:-40)+"px)",opacity:0},{transform:"none",opacity:1}],{duration:400,easing:"cubic-bezier(.34,1.45,.64,1)"});
  };
  btns.forEach(b=>b.onclick=()=>{tab=+b.dataset.t;draw()});
  let x0=0;
  P.ontouchstart=e=>x0=e.touches[0].clientX;
  P.ontouchend=e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>70){tab=d<0?1:0;draw()}};
  window.redraw=draw;draw()}

window.showClassLikers=cid=>{
  if(!canMod(cid))return;
  const c=get("classes",cid);
  const ph=by("photos","classId",cid).filter(p=>!p.memberId);
  const totalClassHearts=ph.reduce((sum,p)=>sum+(Number(p.hearts)||0),0);
  const memberMap=new Map(),guestMap=new Map();
  let extraStranger=0;
  ph.forEach(p=>{
    let entries=[];
    if(Array.isArray(p.likeLog)&&p.likeLog.length){
      entries=p.likeLog;
    }else if(Array.isArray(p.likedBy)&&p.likedBy.length){
      const memIds=p.likedBy.filter(k=>String(k).startsWith("mem:")).map(k=>String(k).slice(4));
      const devIds=p.likedBy.filter(k=>String(k).startsWith("dev:")).map(k=>String(k).slice(4));
      memIds.forEach(mid=>entries.push({dev:"",mid,ts:0}));
      const extraDevs=Math.max(0,devIds.length-memIds.length);
      for(let i=0;i<extraDevs;i++)entries.push({dev:devIds[i]||"",mid:null,ts:0});
    }
    entries.forEach(e=>{
      const u=e?.mid?get("members",e.mid):null;
      const ts=Number(e?.ts)||0;
      if(u){
        const cur=memberMap.get(u.id)||{member:u,count:0,ts:0};
        cur.count+=1;cur.ts=Math.max(cur.ts,ts);
        memberMap.set(u.id,cur);
      }else{
        const gk=e?.dev?("dev:"+e.dev):("anon:"+p.id);
        const cur=guestMap.get(gk)||{count:0,ts:0};
        cur.count+=1;cur.ts=Math.max(cur.ts,ts);
        guestMap.set(gk,cur);
      }
    });
    const pHearts=Number(p.hearts)||0;
    if(pHearts>entries.length)extraStranger+=(pHearts-entries.length);
  });
  const memberList=[...memberMap.values()].sort((a,b)=>(b.ts-a.ts)||(b.count-a.count));
  const guestTotal=[...guestMap.values()].reduce((s,g)=>s+g.count,0)+extraStranger;
  const listHtml=totalClassHearts===0&&!memberList.length&&!guestTotal
    ?`<p class="text-sm text-center opacity-70 py-4">Chưa có lượt thả tim nào.</p>`
    :`<div class="flex flex-col gap-2 max-h-[60vh] overflow-y-auto">
      ${memberList.map(({member:u,count})=>{
        const clsName=get("classes",u.classId)?.name||"";
        const ini=esc((u.name||"?").trim().charAt(0).toUpperCase()||"?");
        return`<a href="#/m/${u.id}" onclick="closeSheet()" class="flex items-center gap-3 p-2.5 rounded-xl bg-white border border-slate-200 hover:bg-yellow-50 transition-colors">
          <div class="w-10 h-10 rounded-full overflow-hidden bg-slate-100 border border-slate-200 shrink-0 flex items-center justify-center font-bold text-slate-500">${u.avatar?`<img src="${esc(opt(u.avatar,120))}" class="w-full h-full object-cover object-top" alt="${esc(u.name)}">`:ini}</div>
          <div class="flex-1 min-w-0">
            <div class="font-bold text-sm text-[var(--ink)] truncate">${esc(u.name)}</div>
            ${clsName?`<div class="text-xs opacity-60 truncate">Lớp ${esc(clsName)}</div>`:""}
          </div>
          ${count>1?`<span class="text-xs font-bold px-2 py-0.5 rounded-full shrink-0" style="color:#ff3b5c;background:#fff1f3">❤ ${count}</span>`:`<span class="text-sm shrink-0" style="color:#ff3b5c">❤</span>`}
        </a>`;
      }).join("")}
      ${guestTotal>0?`<div class="flex items-center gap-3 p-2.5 rounded-xl bg-slate-50 border border-slate-200/80">
        <div class="w-10 h-10 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center shrink-0">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <div class="font-bold text-sm text-[var(--ink)]">Người Lạ</div>
          <div class="text-xs opacity-60">Khách chưa đăng nhập</div>
        </div>
        ${guestTotal>1?`<span class="text-xs font-bold px-2 py-0.5 rounded-full shrink-0" style="color:#ff3b5c;background:#fff1f3">❤ ${guestTotal}</span>`:`<span class="text-sm shrink-0" style="color:#ff3b5c">❤</span>`}
      </div>`:""}
    </div>`;
  sheet(`<h3 class="hand text-3xl mb-3">Người đã thả tim ảnh lớp (❤ ${totalClassHearts})</h3>${listHtml}`);
};

/* ===== #022 – Burst like nâng cấp ===== */
window.burst=b=>{
  if(!b)return;
  b.style.position="relative";
  const wrap=b.closest(".ky22-wrap")||b;
  // Ring
  const ring=document.createElement("span");ring.className="ky22-ring";ring.style.cssText="position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;border:10px solid #FF7A93;transform:scale(0);opacity:0;pointer-events:none";
  b.appendChild(ring);
  ring.animate([{transform:"scale(.3)",opacity:1,borderWidth:"14px"},{transform:"scale(1.6)",opacity:0,borderWidth:"0px"}],{duration:600,easing:"cubic-bezier(.2,.8,.2,1)"}).onfinish=()=>ring.remove();
  // Dots
  const C=["#FF4D6D","#8B6CFF","#FFB547","#22C3A6","#3D8BFF","#FF7A93","#FFB26B"];
  C.forEach((c,i)=>{
    const d=document.createElement("i"),a=i/C.length*Math.PI*2;
    d.style.cssText=`position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:${c};pointer-events:none;margin:-4px`;
    b.appendChild(d);
    d.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*40}px,${Math.sin(a)*40}px) scale(.2)`,opacity:0}],{duration:700,delay:120,easing:"cubic-bezier(.2,.8,.2,1)",fill:"backwards"}).onfinish=()=>d.remove();
  });
  // Heart bounce
  b.animate([{transform:"scale(1)"},{transform:"scale(.72)",offset:.18},{transform:"scale(1.24)",offset:.48},{transform:"scale(1)"}],{duration:700});
};

async function ups(files,cid,mid){
  if(!files.length)return;
  if(!mid&&!isClassInsider(cid))return toastErr("Chỉ thành viên hoặc quản lý lớp mới có quyền thực hiện.");
  if(!mid&&!inClass(cid))return enterCode(cid);
  const dr=$("#drop"),box=$("#up");if(!box)return;
  box.innerHTML="";
  dr?.classList.add("is-uploading");
  let okCount=0,failCount=0,lastErr="";
  try{
    await Promise.all(files.map(async(f,i)=>{
      const li=document.createElement("li");li.className="kyup-row";
      li.innerHTML=`<div class="flex-1 min-w-0 text-left"><span class="kyup-name block">${esc(f.name)}</span><span class="kyup-err hidden" id="kyup-err-${i}"></span></div><span class="kyup-pct" id="kyup-pct-${i}">0%</span><span class="kyup-bar" id="kyup-bar-${i}" style="transform:scaleX(0)"></span>`;
      box.appendChild(li);
      try{
        const u=await uploadImage(f,{onProgress:p=>{
          const bar=document.getElementById("kyup-bar-"+i),pct=document.getElementById("kyup-pct-"+i);
          if(bar)bar.style.transform=`scaleX(${p/100})`;if(pct)pct.textContent=Math.round(p)+"%";
        }});
        await db.set("photos",{id:uid(),classId:cid,memberId:mid,url:u,hearts:0});
        okCount++;
        li.classList.add("done");const pct=document.getElementById("kyup-pct-"+i);if(pct)pct.textContent="✔";
      }catch(e){
        failCount++;
        lastErr=e?.message||"Lỗi tải ảnh";
        li.classList.add("fail");
        const pct=document.getElementById("kyup-pct-"+i),errEl=document.getElementById("kyup-err-"+i);
        if(pct)pct.textContent="✕";
        if(errEl){errEl.textContent=lastErr;errEl.classList.remove("hidden")}
      }
    }));
  }finally{
    dr?.classList.remove("is-uploading");
  }
  if(okCount>0&&failCount===0){
    toast(`Đã tải ${okCount} ảnh ✔`);
    mid?route():redraw();
  }else if(okCount>0){
    toastErr(`Đã tải ${okCount} ảnh, lỗi ${failCount} ảnh: ${lastErr}`);
    mid?route():redraw();
  }else{
    toastErr(lastErr||"Tải ảnh thất bại");
  }
}

function bindGallery(){
  $$("[data-heart]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.busy==="1")return;
    b.dataset.busy="1";
    const p=get("photos",b.dataset.heart);
    if(!p){b.dataset.busy="";return}
    const prevHearts=p.hearts||0;
    const prevLikedBy=Array.isArray(p.likedBy)?[...p.likedBy]:undefined;
    const prevLikeLog=Array.isArray(p.likeLog)?p.likeLog.map(x=>({...x})):undefined;
    const prevLocal=getLocalLikes();
    const keys=getMyLikeKeys(p.classId);
    const already=isPhotoLiked(p);
    let likedBy=Array.isArray(p.likedBy)?[...p.likedBy]:[];
    let likeLog=Array.isArray(p.likeLog)?[...p.likeLog]:[];
    const actorMid=getActorMemberId(p.classId);
    const span=b.querySelector("span");
    const syncMemberTotal=()=>{
      const totEl=document.getElementById("member-total-hearts");
      if(totEl&&p.memberId){
        totEl.textContent=by("photos","memberId",p.memberId).reduce((sum,ph)=>sum+(Number(ph.hearts)||0),0);
      }
      const clsTotEl=document.getElementById("class-total-hearts");
      if(clsTotEl&&!p.memberId){
        clsTotEl.textContent=by("photos","classId",p.classId).filter(ph=>!ph.memberId).reduce((sum,ph)=>sum+(Number(ph.hearts)||0),0);
      }
    };
    try{
      if(!already){
        keys.forEach(k=>{if(!likedBy.includes(k))likedBy.push(k)});
        likeLog=likeLog.filter(x=>!(x&&(x.dev===devId||(actorMid&&x.mid===actorMid))));
        likeLog.push({dev:devId,mid:actorMid,ts:Date.now()});
        p.hearts=prevHearts+1;
        setLocalLikes([...prevLocal,p.id]);
        b.classList.add("is-liked");
        b.setAttribute("aria-pressed","true");
        burst(b);
      }else{
        likedBy=likedBy.filter(k=>!keys.includes(k));
        likeLog=likeLog.filter(x=>!(x&&(x.dev===devId||(actorMid&&x.mid===actorMid))));
        p.hearts=Math.max(0,prevHearts-1);
        setLocalLikes(prevLocal.filter(id=>id!==p.id));
        b.classList.remove("is-liked");
        b.setAttribute("aria-pressed","false");
      }
      p.likedBy=likedBy;
      p.likeLog=likeLog;
      if(span)span.textContent=p.hearts;
      syncMemberTotal();
      await db.set("photos",p);
    }catch(err){
      p.hearts=prevHearts;
      if(prevLikedBy===undefined)delete p.likedBy;else p.likedBy=prevLikedBy;
      if(prevLikeLog===undefined)delete p.likeLog;else p.likeLog=prevLikeLog;
      setLocalLikes(prevLocal);
      b.classList.toggle("is-liked",already);
      b.setAttribute("aria-pressed",already?"true":"false");
      if(span)span.textContent=prevHearts;
      syncMemberTotal();
      toastErr(err?.message||"Không thể cập nhật lượt thả tim.");
    }finally{
      b.dataset.busy="";
    }
  });
  $$("[data-lb]").forEach(el=>el.onclick=()=>{
    const list=$$("[data-lb]").map(x=>get("photos",x.dataset.lb));
    let i=list.findIndex(p=>p.id===el.dataset.lb);
    openLightbox(list,i);
  });
}

function openLightbox(list,idx){
  if(!list||!list.length)return;
  let i=idx,z=1,tx=0,ty=0;
  const single=list.length<=1;
  const pts=new Map();
  let panLastX=0,panLastY=0,swipeStartX=0,swipeStartY=0,mode="",moved=false,lastTapTime=0,lastTapX=0,lastTapY=0,lastTouchDbl=0,lastPinchDist=0;

  document.getElementById("kylb-overlay")?.remove();
  const ov=document.createElement("div");ov.id="kylb-overlay";
  ov.innerHTML=`<img src="${esc(opt(list[i].url,1600))}" alt="" draggable="false" style="max-width:92vw;max-height:92vh;border-radius:8px;user-select:none"><div class="kylb-zoom-label" role="button" tabindex="0">1.0× · Bấm để thu về 1×</div>${single?"":`<button id="kylb-prev" aria-label="Trước">‹</button><button id="kylb-next" aria-label="Sau">›</button>`}<button id="kylb-close" aria-label="Đóng">✕</button>`;
  document.body.appendChild(ov);
  const imgEl=ov.querySelector("img"),zLabel=ov.querySelector(".kylb-zoom-label");

  function clamp(){
    if(z<=1.01){tx=0;ty=0;return}
    const maxX=Math.max(0,(imgEl.offsetWidth*z-ov.clientWidth)/2);
    const maxY=Math.max(0,(imgEl.offsetHeight*z-ov.clientHeight)/2);
    tx=Math.max(-maxX,Math.min(maxX,tx));
    ty=Math.max(-maxY,Math.min(maxY,ty));
  }
  function applyTransform(smooth=false){
    clamp();
    imgEl.style.transition=smooth?"transform .28s cubic-bezier(.2,.8,.2,1)":"none";
    imgEl.style.transform=`translate(${tx}px, ${ty}px) scale(${z})`;
    const isZ=z>1.01;
    ov.classList.toggle("zoomed",isZ);
    if(zLabel)zLabel.textContent=`${z.toFixed(1)}× · Bấm để thu về 1×`;
  }
  function zoomAt(nextZ,clientX,clientY,smooth=false){
    const nz=Math.max(1,Math.min(4.5,nextZ));
    if(nz<=1.01){z=1;tx=0;ty=0;applyTransform(smooth);return}
    const dx=clientX-ov.clientWidth/2;
    const dy=clientY-ov.clientHeight/2;
    tx=dx-(dx-tx)*(nz/z);
    ty=dy-(dy-ty)*(nz/z);
    z=nz;
    applyTransform(smooth);
  }
  function resetZoom(smooth=true){z=1;tx=0;ty=0;applyTransform(smooth)}
  function go(d){
    if(list.length<=1)return;
    i=(i+d+list.length)%list.length;
    z=1;tx=0;ty=0;
    imgEl.src=opt(list[i].url,1600);
    ov.classList.remove("zoomed","is-drag");
    applyTransform(false);
  }
  function closeLb(){
    document.removeEventListener("keydown",kb);
    ov.remove();
  }
  function kb(e){
    if(!document.getElementById("kylb-overlay")){document.removeEventListener("keydown",kb);return}
    if(e.key==="Escape")closeLb();
    else if(!single&&e.key==="ArrowRight")go(1);
    else if(!single&&e.key==="ArrowLeft")go(-1);
  }

  const prevBtn=document.getElementById("kylb-prev"),nextBtn=document.getElementById("kylb-next");
  if(prevBtn)prevBtn.onclick=e=>{e.stopPropagation();go(-1)};
  if(nextBtn)nextBtn.onclick=e=>{e.stopPropagation();go(1)};
  document.getElementById("kylb-close").onclick=closeLb;
  zLabel.onclick=e=>{e.stopPropagation();resetZoom(true)};
  ov.onclick=e=>{if(moved){moved=false;return}if(e.target===ov)closeLb()};

  ov.addEventListener("pointerdown",e=>{
    if(e.target.closest("button, .kylb-zoom-label"))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    try{ov.setPointerCapture(e.pointerId)}catch{}
    if(pts.size===2){
      mode="pinch";moved=true;
      const [a,b]=[...pts.values()];
      lastPinchDist=Math.hypot(b.x-a.x,b.y-a.y)||1;
      ov.classList.remove("is-drag");
    }else if(pts.size===1){
      moved=false;
      panLastX=e.clientX;panLastY=e.clientY;
      swipeStartX=e.clientX;swipeStartY=e.clientY;
      if(z>1.01){mode="pan";ov.classList.add("is-drag")}
      else mode="wait";
    }
  });

  ov.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){
      mode="pinch";moved=true;
      const [a,b]=[...pts.values()];
      const dist=Math.hypot(b.x-a.x,b.y-a.y)||1;
      const midX=(a.x+b.x)/2,midY=(a.y+b.y)/2;
      if(lastPinchDist>0)zoomAt(z*(dist/lastPinchDist),midX,midY,false);
      lastPinchDist=dist;
      return;
    }
    if(pts.size===1){
      if(mode==="pan"||z>1.01){
        const dx=e.clientX-panLastX,dy=e.clientY-panLastY;
        panLastX=e.clientX;panLastY=e.clientY;
        if(Math.hypot(e.clientX-swipeStartX,e.clientY-swipeStartY)>4)moved=true;
        tx+=dx;ty+=dy;
        applyTransform(false);
        return;
      }
      const dx=e.clientX-swipeStartX,dy=e.clientY-swipeStartY;
      if(mode==="wait"&&Math.hypot(dx,dy)>8){moved=true;mode=Math.abs(dy)>Math.abs(dx)?"down":"side"}
      if(mode==="down"){
        const d=Math.max(0,dy);
        ov.style.opacity=Math.max(0.2,1-d/300).toFixed(2);
        imgEl.style.transition="none";
        imgEl.style.transform=`translateY(${d}px) scale(${1-d/1600})`;
      }else if(mode==="side"&&!single){
        imgEl.style.transition="none";
        imgEl.style.transform=`translateX(${dx*0.45}px)`;
      }
    }
  });

  function onPointerEnd(e){
    if(!pts.has(e.pointerId))return;
    pts.delete(e.pointerId);
    ov.classList.remove("is-drag");
    if(pts.size===1){
      const rem=[...pts.values()][0];
      panLastX=rem.x;panLastY=rem.y;
      mode=z>1.01?"pan":"";
      lastPinchDist=0;
      return;
    }
    if(pts.size===0){
      const m=mode;mode="";lastPinchDist=0;
      if(z>1.01||m==="pan"||m==="pinch"){
        applyTransform(false);
      }else{
        const dx=e.clientX-swipeStartX,dy=e.clientY-swipeStartY;
        ov.style.opacity="";
        if(m==="down"&&dy>100){closeLb();return}
        if(m==="side"&&!single&&Math.abs(dx)>60){go(dx<0?1:-1);return}
        applyTransform(true);
      }
      if(e.type==="pointerup"&&e.pointerType!=="mouse"&&!moved&&m!=="pinch"){
        const now=Date.now();
        if(now-lastTapTime<300&&Math.hypot(e.clientX-lastTapX,e.clientY-lastTapY)<35){
          lastTapTime=0;lastTouchDbl=now;
          if(z>1.01)resetZoom(true);else zoomAt(2.5,e.clientX,e.clientY,true);
        }else{
          lastTapTime=now;lastTapX=e.clientX;lastTapY=e.clientY;
        }
      }
      if(moved)setTimeout(()=>{moved=false},60);
    }
  }
  ov.addEventListener("pointerup",onPointerEnd);
  ov.addEventListener("pointercancel",onPointerEnd);

  ov.addEventListener("wheel",e=>{
    e.preventDefault();
    zoomAt(z*(e.deltaY<0?1.15:0.87),e.clientX,e.clientY,false);
  },{passive:false});

  ov.addEventListener("dblclick",e=>{
    if(e.target.closest("button, .kylb-zoom-label"))return;
    if(Date.now()-lastTouchDbl<400)return;
    if(z>1.01)resetZoom(true);else zoomAt(2.5,e.clientX,e.clientY,true);
  });

  document.addEventListener("keydown",kb);
}

function confirmTransferClass(cid,target){

async function updateSecretRecord({btn,errEl,ids,isPin,rec,col,plainKey,hashKey,okMsg}){
  if(!btn||btn.disabled)return;
  if(errEl){errEl.textContent="";errEl.classList.add("hidden")}
  const showErr=msg=>{if(errEl){errEl.textContent=msg;errEl.classList.remove("hidden")}toastErr(msg)};
  const prev=btn.innerHTML;btn.disabled=true;btn.textContent="Đang cập nhật...";
  try{
    const vals=ids.map(k=>($("#"+k)?.value||"").trim());
    const [oldVal,newVal,newVal2]=vals;
    if(!isAdmin()){
      if(!oldVal)return showErr(isPin?"Vui lòng nhập mã PIN hiện tại.":"Vui lòng nhập mật khẩu hiện tại.");
      const okOld=(rec[plainKey]&&rec[plainKey]===oldVal)||(rec[hashKey]&&rec[hashKey]===await sha(oldVal));
      if(!okOld)return showErr(isPin?"Mã PIN hiện tại không đúng.":"Mật khẩu hiện tại không đúng.");
    }
    if(isPin&&!/^\d{4,6}$/.test(newVal))return showErr("Mã PIN mới phải gồm 4 đến 6 chữ số.");
    if(!isPin&&newVal.length<4)return showErr("Mật khẩu mới phải có ít nhất 4 ký tự.");
    if(newVal!==newVal2)return showErr(isPin?"Mã PIN nhập lại không khớp.":"Mật khẩu mới nhập lại không khớp.");
    rec[hashKey]=await sha(newVal);
    delete rec[plainKey];
    await db.set(col,rec);
    ids.forEach(k=>{const el=$("#"+k);if(el)el.value=""});
    toast(okMsg);
  }catch(e){showErr(e?.message||"Không thể cập nhật.")}
  finally{if(btn.isConnected){btn.disabled=false;btn.innerHTML=prev}}
}

      const prev=cfBtn.innerHTML;cfBtn.disabled=true;cfBtn.textContent="Đang lưu...";
      try{

        if(!cur.deleteReq||cur.deleteReq.status!=="pending"){closeSheet();route();return}
        cur.deleteReq.votes={...(cur.deleteReq.votes||{}),[mid]:choice};
        const st=calcDeleteVote(cur);
        if(st.passed){
          await purgeClass(cid);
          closeSheet();
          toast(`Đủ 60% thành viên đồng ý — Lớp ${cur.name} đã được xóa.`);
          location.hash=get("schools",cur.schoolId)?"#/s/"+cur.schoolId:"#/";
        }else if(st.failed){
          cur.deleteReq=null;
          await db.set("classes",cur);
          closeSheet();
          toast(`Không đủ 60% đồng ý — Lớp ${cur.name} được giữ lại ✔`);
          route();
        }else{
          await db.set("classes",cur);
          closeSheet();
          toast("Đã ghi nhận lựa chọn của bạn ✔");
          route();
        }
      }catch(e){
        if(errEl){errEl.textContent=e?.message||"Không thể lưu biểu quyết.";errEl.classList.remove("hidden")}
        toastErr(e?.message||"Không thể lưu biểu quyết.");
      }finally{if(cfBtn.isConnected){cfBtn.disabled=false;cfBtn.innerHTML=prev}}
    };
  };
  renderStep1();
}

function checkPendingDeleteVote(){
  if($("#modal")?.querySelector(".sheet"))return;
  for(const c of S.classes){
    if(c.deleteReq?.status!=="pending")continue;
    const mid=store("me_"+c.id);
    if(!mid||!get("members",mid))continue;

    break;
  }
}

window.showMemberLikers=id=>{
  const m=get("members",id);
  if(!canViewLikers(m))return;
  const ph=by("photos","memberId",id);
  const totalHearts=ph.reduce((sum,p)=>sum+(Number(p.hearts)||0),0);
  const memberMap=new Map(),guestMap=new Map();
  let extraStranger=0;
  ph.forEach(p=>{
    let entries=[];
    if(Array.isArray(p.likeLog)&&p.likeLog.length){
      entries=p.likeLog;
    }else if(Array.isArray(p.likedBy)&&p.likedBy.length){
      const memIds=p.likedBy.filter(k=>String(k).startsWith("mem:")).map(k=>String(k).slice(4));
      const devIds=p.likedBy.filter(k=>String(k).startsWith("dev:")).map(k=>String(k).slice(4));
      memIds.forEach(mid=>entries.push({dev:"",mid,ts:0}));
      const extraDevs=Math.max(0,devIds.length-memIds.length);
      for(let i=0;i<extraDevs;i++)entries.push({dev:devIds[i]||"",mid:null,ts:0});
    }
    entries.forEach(e=>{
      const u=e?.mid?get("members",e.mid):null;
      const ts=Number(e?.ts)||0;
      if(u){
        const cur=memberMap.get(u.id)||{member:u,count:0,ts:0};
        cur.count+=1;cur.ts=Math.max(cur.ts,ts);
        memberMap.set(u.id,cur);
      }else{
        const gk=e?.dev?("dev:"+e.dev):("anon:"+p.id);
        const cur=guestMap.get(gk)||{count:0,ts:0};
        cur.count+=1;cur.ts=Math.max(cur.ts,ts);
        guestMap.set(gk,cur);
      }
    });
    const pHearts=Number(p.hearts)||0;
    if(pHearts>entries.length)extraStranger+=(pHearts-entries.length);
  });
  const memberList=[...memberMap.values()].sort((a,b)=>(b.ts-a.ts)||(b.count-a.count));
  const guestTotal=[...guestMap.values()].reduce((s,g)=>s+g.count,0)+extraStranger;
  const listHtml=totalHearts===0&&!memberList.length&&!guestTotal
    ?`<p class="text-sm text-center opacity-70 py-4">Chưa có lượt thả tim nào.</p>`
    :`<div class="flex flex-col gap-2 max-h-[60vh] overflow-y-auto">
      ${memberList.map(({member:u,count})=>{
        const clsName=get("classes",u.classId)?.name||"";
        const ini=esc((u.name||"?").trim().charAt(0).toUpperCase()||"?");
        return`<a href="#/m/${u.id}" onclick="closeSheet()" class="flex items-center gap-3 p-2.5 rounded-xl bg-white border border-slate-200 hover:bg-yellow-50 transition-colors">
          <div class="w-10 h-10 rounded-full overflow-hidden bg-slate-100 border border-slate-200 shrink-0 flex items-center justify-center font-bold text-slate-500">${u.avatar?`<img src="${esc(opt(u.avatar,120))}" class="w-full h-full object-cover object-top" alt="${esc(u.name)}">`:ini}</div>
          <div class="flex-1 min-w-0">
            <div class="font-bold text-sm text-[var(--ink)] truncate">${esc(u.name)}</div>
            ${clsName?`<div class="text-xs opacity-60 truncate">Lớp ${esc(clsName)}</div>`:""}
          </div>
          ${count>1?`<span class="text-xs font-bold px-2 py-0.5 rounded-full shrink-0" style="color:#ff3b5c;background:#fff1f3">❤ ${count}</span>`:`<span class="text-sm shrink-0" style="color:#ff3b5c">❤</span>`}
        </a>`;
      }).join("")}
      ${guestTotal>0?`<div class="flex items-center gap-3 p-2.5 rounded-xl bg-slate-50 border border-slate-200/80">
        <div class="w-10 h-10 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center shrink-0">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <div class="font-bold text-sm text-[var(--ink)]">Người Lạ</div>
          <div class="text-xs opacity-60">Khách chưa đăng nhập</div>
        </div>
        ${guestTotal>1?`<span class="text-xs font-bold px-2 py-0.5 rounded-full shrink-0" style="color:#ff3b5c;background:#fff1f3">❤ ${guestTotal}</span>`:`<span class="text-sm shrink-0" style="color:#ff3b5c">❤</span>`}
      </div>`:""}
    </div>`;
  sheet(`<h3 class="hand text-3xl mb-3">Người đã thả tim (❤ ${totalHearts})</h3>${listHtml}`);
};

  <p class="text-[11px] opacity-65 mt-1.5">Video nhúng (${S.videos.length} link YouTube/Drive/TikTok) không tính vào dung lượng Cloudinary.</p>`;
  return`${crumbs([["Trang chủ","#/"],["Admin"]])}${head("Bảng điều khiển")}
  <div class="grid grid-cols-2 gap-3 mb-4">${[["Trường",S.schools.length],["Lớp",S.classes.length],["Thành viên",S.members.length],["Ảnh",S.photos.length]].map(([l,n])=>`<div class="card p-3 text-center"><div class="hand text-5xl" data-n="${n}">${n}</div>${l}</div>`).join("")}</div>
  <div class="card p-3 mb-4">${storageBar}</div>
  <div class="card p-3 mb-4"><b>Giới hạn lớp / thiết bị</b><div class="flex gap-2 mt-2"><input id="lim" type="number" min="1" class="inp" value="${cfg().limit}"><button class="btn" onclick="setLim()">Lưu</button></div><button class="btn ghost text-sm mt-2" onclick="resetDev()">Mở khóa thiết bị này</button></div>
  <div class="card p-3 mb-4"><b>Trường học</b>${S.schools.map(s=>`<div class="flex justify-between py-1"><span>${esc(s.name)}</span><span><button class="underline text-sm" onclick="editSchool('${s.id}')">sửa</button> <button class="underline text-sm" onclick="delSchool('${s.id}')">xóa</button></span></div>`).join("")}<button class="btn sun mt-2" onclick="editSchool()">＋ Thêm trường</button></div>
  <div class="card p-3 mb-4"><b>Lớp</b>${S.classes.map(c=>`<div class="flex justify-between py-1"><a href="#/c/${c.id}" class="underline">${esc(c.name)} · ${esc(c.year)} · mã ${c.code}</a><button class="underline text-sm" onclick="confirmDel('${esc(c.name)}',async()=>{await db.del('classes','${c.id}');route()})">xóa</button></div>`).join("")}</div>
  <button class="btn ghost" onclick="sessionStorage.removeItem('ky_admin');route()">Đăng xuất</button>`}

// Animate storage bar on render
function initStorageBar(){
  const segs=$$(".kyst-seg");
  if(segs.length)setTimeout(()=>segs.forEach(s=>{if(s.style.getPropertyValue("--w"))s.classList.add("loaded")}),60);
  countUp();
}
window.confirmDel=confirmDel;window.db=db;
window.adLogin=()=>{if(v("ap")===CONFIG.adminPass){sessionStorage.setItem("ky_admin","1");window.route()}else toast("Sai mật khẩu")};
window.setLim=async()=>{const c=cfg();c.limit=Math.max(1,+v("lim")||1);await db.set("settings",c);toast("Đã lưu")};
window.resetDev=async()=>{const c=cfg();c.resets=[...(c.resets||[]),fp];await db.set("settings",c);toast("Đã mở khóa")};
window.editSchool=id=>{const s=id?get("schools",id):{id:uid(),name:"",cover:""};sheet(`<h3 class="hand text-3xl mb-2">${id?"Sửa":"Thêm"} trường</h3>${field("sn","Tên trường")}<label class="block mb-3 text-sm font-bold">Logo / ảnh bìa<input id="sc" type="file" accept="image/*" class="inp mt-1"></label><button id="ok" class="btn w-full">Lưu</button>`);$("#sn").value=s.name;
  $("#ok").onclick=async()=>{if(!v("sn"))return toast("Nhập tên trường");const btn=$("#ok"),prev=btn.innerHTML;btn.disabled=true;btn.textContent="Đang lưu...";
    try{
      s.name=v("sn");s.slug=slug(s.name);const f=$("#sc").files[0];
      if(f)s.cover=await uploadImage(f,{btn,loadingText:"Đang tải ảnh bìa..."});
      btn.disabled=true;btn.textContent="Đang lưu trường...";
      await db.set("schools",s);closeSheet();toast("Đã lưu trường ✔");route();
    }catch(e){toastErr(e?.message||"Không thể lưu trường")}
    finally{if(btn.isConnected){btn.disabled=false;btn.innerHTML=prev}}}};

/* Hook vào route */
window.route=async function(){
  await route();
  checkPendingDeleteVote();
};

/* ============ KHỞI ĐỘNG ============ */
await db.load();
const q=new URLSearchParams(location.search);
if(q.get("lop")&&get("classes",q.get("lop"))){
  const cid=q.get("lop"),code=q.get("code")||"";
  history.replaceState(null,"",location.pathname+"#/c/"+cid);tab=1;await window.route();
  if(code&&String(get("classes",cid)?.code??"").trim()===String(code).trim()){saveClassAuth(cid,code);$("#class-auth-badge")?.classList.remove("hidden")}
  setTimeout(()=>newMember(cid,code),400);
} else window.route();
</script></body></html>
